[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-v1"
version = "0.1.0"
description = "Private PC-first AI engineering assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.api.routes",
  "app.core",
  "app.llm",
  "app.memory",
  "app.schemas",
  "app.services",
  "app.tools",
  "app.voice",
]
